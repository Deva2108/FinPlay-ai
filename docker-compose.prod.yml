version: '3.8'

services:
  # --- Backend Service (Connects to Neon DB & Upstash Redis) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finplay-backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_SSL_ENABLED=${REDIS_SSL:-true}
      - JWT_SECRET=${JWT_SECRET}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_SCRIPT_URL=${GOOGLE_SCRIPT_URL}
    ports:
      - "8080:8080"
    restart: always

  # --- Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: finplay-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

networks:
  finplay-net:
    driver: bridge
