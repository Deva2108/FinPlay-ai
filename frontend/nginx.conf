# Nginx config for the FinPlay React SPA.
# - Falls back to /index.html so deep links (/portfolio, /trade/AAPL) work on refresh.
# - Long-cache hashed assets, no-cache for index.html.
# - gzip on for JS/CSS/JSON.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers (basic; tighten in Phase 5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # Hashed Vite assets — long cache.
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files — short cache.
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Never cache the entry HTML — clients must always pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak nginx version
    server_tokens off;

    # Deny dotfiles
    location ~ /\. { deny all; }
}
