# =============================================================================
# FinPlay production profile.
# Activated via SPRING_PROFILES_ACTIVE=prod (see docker-compose.yml).
# Inherits everything from application.properties; overrides for prod below.
# =============================================================================

# --- Performance: Java 21 Virtual Threads ---
spring.threads.virtual.enabled=true

# --- Server hardening ---
# Explicitly prefer PORT (Render dynamic port). 
# Fallback to SERVER_PORT if PORT is missing (local docker testing).
server.port=${PORT:${SERVER_PORT:8080}}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Startup ---
# Defer bean creation to first use; cuts Render cold-start significantly.
spring.main.lazy-initialization=true

# --- JPA / Hibernate (prod) ---
# Defer JPA repository initialization to a background thread so Tomcat can bind
# immediately. Extremely critical for Render free-tier cold starts.
spring.data.jpa.repositories.bootstrap-mode=deferred

# 'update' is safer during these entity transitions on Render.
# Switch to 'none' once the market column is confirmed stable in Neon.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Connection pool (Hikari) — sized for Render free + Neon free ---
# Neon free has a hard ~100 connection cap shared across compute branches and
# psql sessions, and the Render free dyno only gives us ~0.1 CPU — so 20
# parallel DB connections is wasted oxygen. 10 max / 2 idle gives plenty of
# headroom for the actual concurrency this tier can drive.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000
# Allow up to 60 s for the initial pool connection so Neon serverless can
# complete its cold-start (typically 1-3 s) before we give up and crash.
# Crashing is correct; silently falling back to H2 is not.
spring.datasource.hikari.initialization-fail-timeout=60000

# --- Tomcat — sized for Render free dyno (~0.1 CPU, ~512 MB) ---
# Spring Boot's default is 200 worker threads, which on a tiny dyno just
# means more memory wasted on stack space and more context switching for no
# real concurrency gain. 20 workers handle realistic free-tier load and keep
# the JVM comfortably inside the -Xmx512m heap configured in pom.xml.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.connection-timeout=10s

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.example.stockPortfolio=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [rid=%X{rid:-}] %-5level %logger{36} - %msg%n

# --- Actuator ---
# Health endpoint exposed for Docker/Render healthchecks; metrics and startup added for diagnostics.
management.endpoints.web.exposure.include=health,info,metrics,startup
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true

# --- Swagger: default OFF in prod. Set SWAGGER_ENABLED=true on the Render
# dashboard if you need it for QA on a preview deploy. Leaving it on by default
# leaks the full API surface publicly and costs ~150-300ms of springdoc
# reflective scan at startup that we don't need in production traffic.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# --- Cache ---
spring.cache.type=redis
spring.data.redis.timeout=3s
# Upstash uses TLS + a password. Locally these are unset and Redis runs plain.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}

# --- Trading / business ---
finplay.starting-balance=${FINPLAY_STARTING_BALANCE:100000}

# --- Scheduler cadence (prod overrides) ---------------------------------------
# Default in code is 60s, which is unnecessarily aggressive on the 0.1-CPU
# Render free dyno. Every minute the scheduler fans out external HTTP calls
# (TwelveData/Finnhub/Yahoo) that compete with user-request CPU. 180s gives
# the same UX (caches stay fresh for 30-min Redis TTL) at 1/3 the load.
# Override per env if you scale up.
finplay.scheduler.hydration-rate-ms=${SCHEDULER_HYDRATION_MS:180000}
finplay.scheduler.movers-rate-ms=${SCHEDULER_MOVERS_MS:180000}
finplay.scheduler.afterhours-rate-ms=${SCHEDULER_AFTERHOURS_MS:300000}
finplay.scheduler.ai-rate-ms=${SCHEDULER_AI_MS:1800000}
