# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

google.script.url=https://script.google.com/macros/s/AKfycbz_z4jplB6Cl-i_otHam395GsI5dXr3ZDZlBFoIhVqa_tBovHdePYGsib_JpUjU5uS-/exec

# Redis Configuration
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true


# NewsAPI Configuration
news.api.key=${NEWS_API_KEY:mock}
news.api.base-url=https://newsapi.org/v2

# Stock Market API (Finnhub)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.base-url=https://finnhub.io/api/v1

# AI Gemini API
gemini.api.key=${GEMINI_API_KEY:mock}

# AI Groq API (FinPlay primary LLM)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Twelve Data API (Primary Global Source)
twelvedata.api.key=${TWELVEDATA_API_KEY:}
twelvedata.base-url=https://api.twelvedata.com

# Alpha Vantage (fallback historical/indicators)
alpha.vantage.key=${ALPHA_VANTAGE_KEY:}

# YouTube Data API v3 (content layer)
youtube.api.key=${YOUTUBE_API_KEY:}

# Forex (USD-INR via open ExchangeRate-API)
forex.base-url=${FOREX_BASE_URL:https://open.er-api.com/v6/latest}

# CORS ? comma-separated, never use "*"
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin allowlist ? comma-separated emails granted ROLE_ADMIN.
# Edit ADMIN_EMAILS in env and redeploy to add or remove an admin.
app.admin-emails=${ADMIN_EMAILS:}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger Configuration
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,circuitbreakers,ratelimiters
management.endpoint.health.show-details=always

# Resilience4j Aspect Order (CircuitBreaker wraps Retry)
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

# Circuit Breakers
resilience4j.circuitbreaker.instances.twelvedata.slidingWindowSize=10
resilience4j.circuitbreaker.instances.twelvedata.failureRateThreshold=50
resilience4j.circuitbreaker.instances.twelvedata.waitDurationInOpenState=30s

resilience4j.circuitbreaker.instances.finnhub.slidingWindowSize=10
resilience4j.circuitbreaker.instances.finnhub.failureRateThreshold=50
resilience4j.circuitbreaker.instances.finnhub.waitDurationInOpenState=30s

resilience4j.circuitbreaker.instances.alphavantage.slidingWindowSize=5
resilience4j.circuitbreaker.instances.alphavantage.failureRateThreshold=50
resilience4j.circuitbreaker.instances.alphavantage.waitDurationInOpenState=60s

resilience4j.circuitbreaker.instances.groq.slidingWindowSize=5
resilience4j.circuitbreaker.instances.groq.failureRateThreshold=50
resilience4j.circuitbreaker.instances.groq.waitDurationInOpenState=30s

# Rate Limiters
resilience4j.ratelimiter.instances.twelvedata.limitForPeriod=8
resilience4j.ratelimiter.instances.twelvedata.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.twelvedata.timeoutDuration=0

resilience4j.ratelimiter.instances.finnhub.limitForPeriod=30
resilience4j.ratelimiter.instances.finnhub.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.finnhub.timeoutDuration=0

resilience4j.ratelimiter.instances.alphavantage.limitForPeriod=5
resilience4j.ratelimiter.instances.alphavantage.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.alphavantage.timeoutDuration=0

resilience4j.ratelimiter.instances.newsapi.limitForPeriod=2
resilience4j.ratelimiter.instances.newsapi.limitRefreshPeriod=1h
resilience4j.ratelimiter.instances.newsapi.timeoutDuration=0

# Retries
resilience4j.retry.instances.default.maxAttempts=2
resilience4j.retry.instances.default.waitDuration=1s
resilience4j.retry.instances.default.enableExponentialBackoff=true
resilience4j.retry.instances.default.exponentialBackoffMultiplier=2